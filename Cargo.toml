[package]
name = "orbit-vpn"
version = "0.3.6"
edition = "2024"
license = "MIT"

[dependencies]
eframe = { version = "0.34", default-features = false, features = ["glow", "default_fonts"] }
base64 = "0.22"
percent-encoding = "2.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "native-tls", "socks"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
url = "2"
uuid = "1"
png = "0.18"
flate2 = "1"
sha2 = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_Shell", "Win32_Security_Cryptography", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_IO", "Win32_System_Com", "Win32_System_Registry"] }
